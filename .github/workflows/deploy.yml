name: Deploy GCP BigQuery MCP Server

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

# Prevent multiple runs for same ref
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: mcp-bigquery-server

jobs:
  # Run lint, typecheck, and tests in parallel
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info

  build-and-deploy:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build Docker image
        id: build
        run: |
          IMAGE=gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker build -t $IMAGE .
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE || echo "")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        id: push
        run: |
          docker push ${{ steps.build.outputs.image }}
          DIGEST=$(gcloud container images describe ${{ steps.build.outputs.image }} --format='value(image_summary.digest)')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # §12.3 Sigstore cosign keyless signing + SLSA build provenance.
      - name: Generate SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes gcr.io/$PROJECT_ID/$SERVICE_NAME@${{ steps.push.outputs.digest }}

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Deploy to Cloud Run (pinned to signed digest)
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME@${{ steps.push.outputs.digest }} \
            --region $REGION \
            --platform managed \
            --service-account ${{ secrets.GCP_SA_EMAIL }} \
            --min-instances 1 \
            --max-instances 10
