name: Deploy GCP BigQuery MCP Server

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

# Prevent multiple runs for same ref
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # gcr.io was shut down 2025-03-18; all images now live in Artifact Registry (europe-west2).
  REGION: europe-west2
  AR_REGISTRY: europe-west2-docker.pkg.dev
  AR_REPO: db-mcp
  IMAGE_NAME: mcp-bigquery-server
  # Cloud Run service name managed by Terraform (mcp-bigquery-server-<env>).
  SERVICE_NAME: mcp-bigquery-server-prod
  # KMS key used for cosign signing; public half is referenced by the BinAuth policy
  # managed in terraform/. See ADR-031 for policy details.
  COSIGN_KMS_KEY: gcpkms://projects/${{ secrets.GCP_PROJECT_ID }}/locations/europe-west2/keyRings/binauth/cryptoKeys/cosign

jobs:
  # Run lint, typecheck, and tests in parallel
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info

  build-sign-push:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Outputs the fully-qualified image reference (registry/repo/image@sha256:...)
    # consumed by the cloud-deploy job.
    outputs:
      image_with_digest: ${{ steps.image_ref.outputs.image_with_digest }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        # Bumped to v3 — required before Node 24 deadline 2026-06-02.
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        # Artifact Registry replaced gcr.io (shut down 2025-03-18).
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }}

      - name: Build Docker image
        id: build
        run: |
          IMAGE=${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        id: push
        run: |
          docker push "${{ steps.build.outputs.image }}"
          # Retrieve the immutable content-addressable digest; deploy always pins to this.
          DIGEST=$(gcloud artifacts docker images describe \
            "${{ steps.build.outputs.image }}" \
            --format='value(image_summary.digest)')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Compute pinned image reference
        id: image_ref
        run: |
          BASE=${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
          echo "image_with_digest=${BASE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # §12.3  SBOM → scan → sign → provenance pipeline
      - name: Generate SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.build.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with KMS key (Binary Authorization)
        # KMS-key signing (replaces keyless/COSIGN_EXPERIMENTAL).
        # The BinAuth policy in terraform/ requires the public half of
        # gcpkms://…/keyRings/binauth/cryptoKeys/cosign to be present on
        # every deployed image. The Terraform agent created that key and the
        # attestor; do NOT change the key path without coordinating that side.
        run: |
          cosign sign --yes \
            --key "${{ env.COSIGN_KMS_KEY }}" \
            "${{ steps.image_ref.outputs.image_with_digest }}"

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.AR_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Default deploy path: image-only update on the Terraform-managed Cloud
  # Run service. Terraform owns every other aspect of the service (env vars,
  # scaling, VPC egress, secret mounts, IAM, etc.) and ignores image changes
  # via lifecycle.ignore_changes, so this CI step never fights `terraform
  # apply`. The service must already exist (created by `terraform apply`
  # of the cloud_run module).
  #
  # Cloud Deploy progressive delivery is provided as scaffolding in
  # clouddeploy.yaml + skaffold.yaml; activate it by replacing this job
  # with `gcloud deploy releases create` once the pipeline + targets have
  # been registered in GCP (see deployment/README.md).
  deploy:
    needs: build-sign-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update Cloud Run service image (pinned to signed digest)
        run: |
          gcloud run services update "${{ env.SERVICE_NAME }}" \
            --image "${{ needs.build-sign-push.outputs.image_with_digest }}" \
            --region "${{ env.REGION }}" \
            --quiet
          echo "Deployed ${{ needs.build-sign-push.outputs.image_with_digest }} to ${{ env.SERVICE_NAME }} in ${{ env.REGION }}."
