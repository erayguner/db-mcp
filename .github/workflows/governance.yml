name: Governance Pre-flight

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths:
      - 'config/policies/**'
      - 'docs/governance/**'
      - 'src/governance/**'
      - 'src/auth/audit-logger.ts'
      - 'scripts/governance/**'
      - '.github/workflows/governance.yml'

permissions:
  contents: read

jobs:
  policy-schema:
    name: Policy + boundary contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate policies + boundary contracts
        run: npx tsx scripts/governance/validate-policies.ts

  governance-tests:
    name: Governance unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run governance tests
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --config jest.config.mjs tests/governance
