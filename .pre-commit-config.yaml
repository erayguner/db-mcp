---
# Comprehensive pre-commit hooks for db-mcp (TypeScript + Terraform + Docker)
#
# Install:   pre-commit install && pre-commit install --hook-type commit-msg
# Run all:   pre-commit run --all-files
# Update:    pre-commit autoupdate
#
# Hook scopes:
#   pre-commit  — fast, file-local checks (formatters, linters)
#   pre-push    — slow, repo-wide checks (typecheck, terraform validate)
#   commit-msg  — conventional commit format

default_install_hook_types: [pre-commit, pre-push, commit-msg]
fail_fast: false

exclude: |
  (?x)^(
    node_modules/.*|
    dist/.*|
    coverage/.*|
    \.terraform/.*|
    package-lock\.json|
    .*\.min\.(js|css)|
    Model\.pdf|
    jest_output\.txt|
    jest_config_dump\.json|
    npm_install\.log
  )$

repos:
  # ---------------------------------------------------------------------------
  # General hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # TypeScript / JavaScript — local hooks so versions match package.json
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier (format TS/JS/JSON/MD/YAML)
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, jsx, json, markdown, yaml]
        exclude: ^(terraform/|\.pre-commit-config\.yaml)

      - id: eslint
        name: eslint (src/**)
        entry: npx --no-install eslint --fix
        language: system
        files: ^src/.*\.(ts|tsx|js|jsx)$
        require_serial: true

      - id: typecheck
        name: tsc --noEmit
        entry: npm run -s typecheck
        language: system
        types: [ts]
        pass_filenames: false
        stages: [pre-push]

      - id: jest-affected
        name: jest (unit + integration)
        entry: npm test --silent
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ---------------------------------------------------------------------------
  # Terraform
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
        stages: [pre-push]
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_checkov
        args:
          - --args=--quiet
          - --args=--compact
          - --args=--framework=terraform
          # Pre-existing findings tracked as separate tech debt:
          #   CKV_TF_1    module pinning (we use relative modules)
          #   CKV_GCP_73  Cloud Armor log4shell rule
          #   CKV_GCP_80  BQ table CSEK (we use CMEK via KMS)
          #   CKV_GCP_81  BQ dataset CSEK (same as above)
          #   CKV_GCP_125 GitHub OIDC trust policy hardening
          - --args=--skip-check=CKV_TF_1,CKV_GCP_73,CKV_GCP_80,CKV_GCP_81,CKV_GCP_125
        stages: [pre-push]

  # ---------------------------------------------------------------------------
  # Dockerfile — hadolint via Docker (no local binary required)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: hadolint
        name: hadolint (Dockerfile)
        entry: scripts/pre-commit-hadolint.sh
        language: system
        files: (^|/)Dockerfile(\..*)?$
        pass_filenames: true

  # ---------------------------------------------------------------------------
  # YAML
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  # ---------------------------------------------------------------------------
  # Markdown (uses system markdownlint)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: markdownlint --fix --config .markdownlint.json
        language: system
        types: [markdown]
        exclude: ^(node_modules|dist|docs/superpowers)/

  # ---------------------------------------------------------------------------
  # Shell
  # ---------------------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # ---------------------------------------------------------------------------
  # Conventional commits (commit message stage)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
